    <script>
      // Language, before anything loads: the page language, the title and share tags, and the preload of the font file
      // that language needs. Mirrors resolveLocale() in src/content/locale.ts (?lang > saved setting > build default
      // VITE_LOCALE > browser languages): keep the two in step.
      (function () {
        var norm = function (v) {
          v = String(v || '').toLowerCase();
          return v.indexOf('zh') === 0 ? 'zh' : v === 'en' || v.indexOf('en-') === 0 ? 'en' : null;
        };
        var saved = null;
        try {
          saved = (JSON.parse(localStorage.getItem('houshi.settings.v1')) || {}).language;
          // no setting yet: a player from before the English version (they have a save or a nickname) keeps zh
          // (firstLanguage in locale.ts, which then saves it)
          if (typeof saved !== 'string' && (localStorage.getItem('houshi.save.v1') !== null || localStorage.getItem('houshi.nick.v1') !== null)) saved = 'zh';
        } catch (e) {}
        var lang = norm(new URLSearchParams(location.search).get('lang')) || norm(saved) || norm('');
        if (!lang) {
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          lang = 'en';
          for (var i = 0; i < langs.length; i++) if (norm(langs[i]) === 'zh') lang = 'zh';
        }
        var d = document;
        d.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        if (lang === 'en') {
          var title = 'Backrooms: No Way Back';
          var blurb = 'You clipped out of reality. It is huge in here, and we are mapping it together.';
          d.title = title;
          d.querySelector('meta[name="description"]').setAttribute('content', blurb);
          d.querySelector('meta[property="og:title"]').setAttribute('content', title);
          d.querySelector('meta[property="og:description"]').setAttribute('content', blurb);
        }
        var link = d.createElement('link');
        link.rel = 'preload';
        link.as = 'font';
        link.type = 'font/woff2';
        link.crossOrigin = '';
        link.href = lang === 'en' ? 'fonts/fusion-pixel-12-latin.cfc9eb14e8.woff2' : 'fonts/fusion-pixel-12-zh.782011ce6d.woff2';
        d.head.appendChild(link);
      })();
    </script>
